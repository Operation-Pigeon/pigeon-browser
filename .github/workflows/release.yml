name: release

# Tag vX.Y.Z (or run manually) -> Windows installer attached to a GitHub
# Release by electron-builder. No secrets needed beyond the workflow token.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: npm ci

      - run: npm run typecheck

      - run: npm run build

      - name: Package and publish
        run: npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
