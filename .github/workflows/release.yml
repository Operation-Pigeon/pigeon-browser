name: release

# Tag vX.Y.Z (or run manually) -> Windows installer attached to a GitHub
# Release by electron-builder. No secrets needed beyond the workflow token —
# which now also has to fetch the generated API client from GitHub Packages,
# so the install step needs `packages: read` and a registry to authenticate
# against.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  packages: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: https://npm.pkg.github.com

      # `@operation-pigeon/client` is generated from the Smithy model and
      # published privately, so this fails without a token — loudly, at
      # install, rather than by building against something stale.
      - run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - run: npm run typecheck

      - run: npm run build

      # electron-builder publishes each artifact independently, and each one
      # creates the release if it's missing. Those calls race: on v0.5.0 both
      # fired, one lost, and its upload — the 90MB installer — vanished while
      # the job still exited 0, leaving a release with only a blockmap and no
      # latest.yml for the updater to read. Creating it up front means every
      # uploader finds an existing release.
      - name: Ensure the release exists
        if: startsWith(github.ref, 'refs/tags/')
        run: gh release create "$env:GITHUB_REF_NAME" --title "$env:GITHUB_REF_NAME" --notes "" --verify-tag
        continue-on-error: true # already exists on a re-run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Package and publish
        run: npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # A release without the installer and latest.yml is worse than no
      # release: the updater reads latest.yml, so a partial upload silently
      # strands every installed copy on the old version.
      # The tag and package.json must agree, and this is where that is cheap to
      # find out. electron-builder names the release from package.json, not
      # from the tag: v0.6.0 built from a tree still saying 0.5.0 targeted the
      # *old* release, found it published more than two hours ago, and skipped
      # uploading — leaving an empty release that the updater then reads as the
      # latest, stranding every installed copy.
      - name: The tag must match the version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $tag = "$env:GITHUB_REF_NAME" -replace '^v', ''
          Write-Host "package.json $version, tag $tag"
          if ($version -ne $tag) { throw "package.json is $version but the tag is $tag" }

      - name: Verify the published assets
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          $assets = @(gh release view "$env:GITHUB_REF_NAME" --json assets --jq '.assets[].name')
          Write-Host "assets: $($assets -join ', ')"
          # Counted first, and this is the case that got through: an empty
          # array `-notmatch` anything is an empty array, which is falsy, so
          # both guards below passed a release with nothing in it at all —
          # the exact failure they exist to catch.
          if ($assets.Count -eq 0) { throw "no assets published - the release is empty" }
          if (-not ($assets -match 'latest\.yml')) { throw "latest.yml missing - auto-update would break" }
          if (-not ($assets -match '\.exe($|\s)')) { throw "installer missing" }
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
