<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Pigeon">
  <!-- Pigeon's mark: a perched carrier pigeon.

       Red on dark rather than white on red. The bird carries the colour now,
       which keeps its shape legible where a white silhouette on a coloured
       square went flat — and rose-500 rather than the -600 that was the
       background, because that darker red disappears against near-black at
       the size that decides it.

       Drawn for 16px first. The proportions are what make it a pigeon rather
       than a dove — deep round breast, short neck, small head, slim beak —
       and each is exaggerated slightly, because at favicon size a faithful
       bird is a smudge.

       The bird is translated by (-2.2, -2.65) so its painted bounding box
       sits in the middle of the square. Its coordinates were centred before
       that and it still looked high and to the left, which is the difference
       between centring a path's numbers and centring what you can see. -->
  <rect width="64" height="64" rx="14" fill="#0f172a"/>
  <g transform="translate(-2.2 -2.65)" fill="#f43f5e">
    <!-- Breast, belly and feet. -->
    <path d="M40 22.5c-7.5 0-13.5 5-15.2 11.8L12.5 39c-1.1.4-1.1 2 0 2.4l10.8 3.6c1.7 4 5.4 6.9 9.9 7.4v2.1c0 .7.6 1.3 1.3 1.3h2c.7 0 1.3-.6 1.3-1.3v-2.2c6.7-1.3 11.7-6.8 11.7-13.4 0-8.6-4.2-16.4-9.5-16.4z"/>
    <!-- Head, sat straight on the shoulders. Any neck at all reads as a goose. -->
    <circle cx="42.4" cy="21.6" r="8.1"/>
    <!-- Beak: short, slim, angled down. Long reads as a songbird, wide as a duck. -->
    <path d="M50 20.4l6.6 2.1c.6.2.6 1.1 0 1.3l-6.6 2.1z"/>
    <!-- Tail, squared off rather than fanned. -->
    <path d="M22.6 36.6l-9.8-4.4c-.9-.4-1.8.6-1.3 1.4l4.4 7.2z"/>
  </g>
  <!-- Knocked out of the head rather than drawn on it, so the eye is the
       background showing through and cannot mismatch it — which is why
       inverting the mark was two colour changes rather than three. -->
  <circle cx="43.2" cy="17.55" r="1.6" fill="#0f172a"/>
</svg>
